<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Excursão Praia - Reserva Rápida</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        ocean: {
                            950: '#040d1a',
                            900: '#07172e',
                            800: '#0c2447',
                            700: '#133566',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-slate-950 m-0 p-0 overflow-hidden h-[100dvh] w-screen flex items-center justify-center sm:bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] sm:from-slate-900 sm:via-slate-950 sm:to-black">

    <!-- Container Estilo Smartphone (100% tela no mobile, moldura de celular centralizada no desktop) -->
    <main id="phone-frame" class="relative w-full h-[100dvh] sm:w-[412px] sm:h-[94dvh] sm:max-h-[850px] bg-gradient-to-b from-ocean-900 via-ocean-950 to-slate-950 sm:rounded-[2.5rem] sm:border-[6px] sm:border-slate-800 sm:shadow-[0_25px_70px_-15px_rgba(6,182,212,0.28)] flex flex-col justify-between overflow-hidden px-4 py-3 sm:py-4 select-none">

        <!-- Notch decorativo visível apenas em telas maiores (simulação de celular) -->
        <div class="hidden sm:flex justify-center items-center w-full pb-1 shrink-0">
            <div class="w-24 h-1.5 bg-slate-800 rounded-full"></div>
        </div>

        <!-- 1. Cabeçalho / Título Destacado -->
        <header class="flex items-center justify-between gap-2 shrink-0 pt-0.5">
            <div class="flex items-center gap-2 min-w-0">
                <span class="flex items-center justify-center w-8 h-8 rounded-xl bg-cyan-500/15 border border-cyan-400/30 text-cyan-400 shrink-0 shadow-inner">
                    <!-- Ícone Sol / Onda -->
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </span>
                <div class="min-w-0">
                    <span class="block text-[10px] font-bold uppercase tracking-widest text-cyan-400 leading-none mb-0.5">Bate e Volta Oficial</span>
                    <h1 id="display-title" class="text-base sm:text-lg font-black tracking-tight text-white truncate leading-tight uppercase">
                        EXCURSÃO PARA A PRAIA
                    </h1>
                </div>
            </div>

            <!-- Botão Modo Organizador -->
            <button id="open-admin-btn" type="button" title="Configurar Excursão (Organizador)" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 active:scale-95 border border-white/10 text-slate-300 hover:text-cyan-300 transition shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </header>

        <!-- 2. Card do Destino (Imagem flexível que se adapta ao espaço vertical disponível) -->
        <section class="relative flex-1 min-h-0 my-2.5 rounded-2xl overflow-hidden border border-cyan-500/25 shadow-lg bg-ocean-800 flex flex-col justify-end group">
            <!-- Foto da Praia -->
            <img id="display-image"
                 src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                 onerror="this.onerror=null;this.src='https://placehold.co/600x400/0c2447/38bdf8?text=Praia+Paradisiaca';"
                 alt="Destino da Praia"
                 class="absolute inset-0 w-full h-full object-cover object-center transition-transform duration-700 group-hover:scale-105" />

            <!-- Gradiente de legibilidade -->
            <div class="absolute inset-0 bg-gradient-to-t from-ocean-950 via-ocean-950/60 to-transparent"></div>

            <!-- Selo Superior: Data da Viagem -->
            <div class="absolute top-2.5 left-2.5 right-2.5 flex items-center justify-between gap-2">
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-ocean-950/80 backdrop-blur-md border border-cyan-400/30 text-xs font-semibold text-cyan-200 shadow">
                    <svg class="w-3.5 h-3.5 text-cyan-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span id="display-date">Domingo, 13/12/2026</span>
                </div>

                <span class="px-2 py-0.5 rounded-full bg-emerald-500/20 backdrop-blur-md border border-emerald-400/30 text-[10px] font-bold uppercase tracking-wider text-emerald-300">
                    Vagas Abertas
                </span>
            </div>

            <!-- Informações Principais sobrepostas na base da foto -->
            <div class="relative z-10 p-3 flex items-end justify-between gap-2">
                <div class="min-w-0">
                    <div class="flex items-center gap-1 text-cyan-300 text-[11px] font-semibold uppercase tracking-wider mb-0.5">
                        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span>Destino</span>
                    </div>
                    <h2 id="display-destination" class="text-lg sm:text-xl font-extrabold text-white leading-tight truncate">
                        Praia de Salinas - Atalaia
                    </h2>
                </div>

                <!-- Badge Valor da Passagem -->
                <div class="shrink-0 text-right bg-cyan-500/15 backdrop-blur-md border border-cyan-400/35 rounded-xl px-2.5 py-1.5">
                    <span class="block text-[10px] font-medium text-cyan-200 leading-none">Passagem</span>
                    <span id="display-price" class="text-base sm:text-lg font-black text-cyan-300 leading-tight">R$ 85,00</span>
                </div>
            </div>
        </section>

        <!-- 3. Observação em Destaque: Data Limite de Pagamento -->
        <div class="shrink-0 mb-2.5 px-3 py-2 rounded-xl bg-amber-500/15 border border-amber-400/40 flex items-center gap-2.5 shadow-sm">
            <span class="flex items-center justify-center w-6 h-6 rounded-lg bg-amber-500/20 text-amber-300 shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </span>
            <p id="display-deadline" class="text-xs font-semibold text-amber-200 leading-snug">
                Pagamento até <strong class="text-amber-300 underline decoration-amber-400/60">10/12/2026</strong> para garantir sua vaga!
            </p>
        </div>

        <!-- 4. Formulário Compacto de Reserva -->
        <form id="booking-form" class="shrink-0 bg-white/[0.04] border border-white/10 rounded-2xl p-3 flex flex-col gap-2.5 shadow-inner" novalidate>
            <!-- Campo Nome -->
            <div>
                <label for="passenger-name" class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1">
                    Seu Nome Completo
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </span>
                    <input id="passenger-name"
                           type="text"
                           placeholder="Digite seu nome para a lista..."
                           autocomplete="name"
                           class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-ocean-950/90 border border-slate-700/80 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition" />
                </div>
            </div>

            <!-- Linha Vagas + Valor Total Dinâmico -->
            <div class="grid grid-cols-2 gap-2.5 items-center">
                <!-- Seletor de Vagas -->
                <div>
                    <label for="seats-input" class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1">
                        Qtd. Vagas
                    </label>
                    <div class="flex items-center justify-between bg-ocean-950/90 border border-slate-700/80 rounded-xl p-1">
                        <button type="button" id="btn-minus" aria-label="Diminuir vagas" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-300 font-bold text-lg flex items-center justify-center transition">
                            −
                        </button>
                        <input id="seats-input"
                               type="number"
                               min="1"
                               max="50"
                               value="1"
                               class="w-10 text-center bg-transparent text-white font-extrabold text-base focus:outline-none" />
                        <button type="button" id="btn-plus" aria-label="Aumentar vagas" class="w-8 h-8 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 active:scale-95 text-cyan-300 font-bold text-lg flex items-center justify-center transition">
                            +
                        </button>
                    </div>
                </div>

                <!-- Resumo Total -->
                <div>
                    <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1">
                        Valor Total
                    </span>
                    <div class="h-[42px] px-3 rounded-xl bg-cyan-950/50 border border-cyan-500/30 flex items-center justify-between">
                        <span class="text-[11px] text-cyan-300/80 font-medium">Total:</span>
                        <span id="display-total" class="text-base font-black text-cyan-300 tracking-tight">R$ 85,00</span>
                    </div>
                </div>
            </div>

            <!-- Mensagem de Erro Discreta (Toast Inline) -->
            <div id="form-error" class="hidden items-center gap-1.5 text-xs font-medium text-rose-300 bg-rose-500/15 border border-rose-500/30 rounded-lg px-2.5 py-1.5">
                <svg class="w-3.5 h-3.5 shrink-0 text-rose-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="form-error-text">Por favor, informe seu nome completo.</span>
            </div>

            <!-- Botão Principal WhatsApp -->
            <button type="submit" id="submit-whatsapp-btn" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-green-500 hover:from-emerald-400 hover:to-green-400 active:scale-[0.98] text-slate-950 font-extrabold text-sm sm:text-base shadow-[0_8px_25px_-4px_rgba(16,185,129,0.5)] flex items-center justify-center gap-2 transition cursor-pointer">
                <!-- Ícone SVG WhatsApp -->
                <svg class="w-5 h-5 fill-current shrink-0" viewBox="0 0 24 24">
                    <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zM12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2.546 20.2c-.151.512.318.983.831.833l3.063-.889A9.953 9.953 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/>
                </svg>
                <span>Reservar pelo WhatsApp</span>
            </button>
        </form>

        <!-- Barra Home decorativa estilo smartphone no desktop -->
        <div class="hidden sm:flex justify-center items-center w-full pt-1 shrink-0">
            <div class="w-28 h-1 bg-slate-700/80 rounded-full"></div>
        </div>

        <!-- ===================================================================== -->
        <!-- MODAL DISCRETO: MODO ORGANIZADOR (EDITA DADOS DA EXCURSÃO)            -->
        <!-- ===================================================================== -->
        <div id="admin-modal" class="hidden absolute inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex flex-col justify-between p-4 overflow-y-auto">
            <div class="flex items-center justify-between border-b border-white/10 pb-2.5 shrink-0">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
                    <h3 class="text-sm font-extrabold uppercase tracking-wider text-white">Configurar Passeio</h3>
                </div>
                <button id="close-admin-btn" type="button" class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-slate-300 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="space-y-2.5 my-2 text-xs overflow-y-auto pr-0.5">
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">Título Destacado</label>
                    <input id="cfg-title" type="text" class="w-full px-3 py-2 rounded-xl bg-ocean-900 border border-slate-700 text-white focus:border-cyan-400 focus:outline-none" />
                </div>

                <div>
                    <label class="block font-semibold text-slate-300 mb-1">Nome do Destino (Praia)</label>
                    <input id="cfg-destination" type="text" class="w-full px-3 py-2 rounded-xl bg-ocean-900 border border-slate-700 text-white focus:border-cyan-400 focus:outline-none" />
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">Valor Passagem (R$)</label>
                        <input id="cfg-price" type="number" step="0.01" min="0" class="w-full px-3 py-2 rounded-xl bg-ocean-900 border border-slate-700 text-white focus:border-cyan-400 focus:outline-none" />
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">Data da Viagem</label>
                        <input id="cfg-date" type="text" placeholder="Ex: 13/12/2026" class="w-full px-3 py-2 rounded-xl bg-ocean-900 border border-slate-700 text-white focus:border-cyan-400 focus:outline-none" />
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">Data Limite Pagto.</label>
                        <input id="cfg-deadline" type="text" placeholder="Ex: 10/12/2026" class="w-full px-3 py-2 rounded-xl bg-ocean-900 border border-slate-700 text-white focus:border-cyan-400 focus:outline-none" />
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">WhatsApp (com DDI)</label>
                        <input id="cfg-phone" type="tel" placeholder="5591989213312" class="w-full px-3 py-2 rounded-xl bg-ocean-900 border border-slate-700 text-white focus:border-cyan-400 focus:outline-none" />
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-300 mb-1">Foto do Destino (Link ou Upload)</label>
                    <div class="flex gap-2">
                        <input id="cfg-image-url" type="text" placeholder="Cole o link da imagem..." class="flex-1 px-3 py-2 rounded-xl bg-ocean-900 border border-slate-700 text-white focus:border-cyan-400 focus:outline-none" />
                        <label class="px-3 py-2 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-400/40 text-cyan-300 font-bold cursor-pointer flex items-center justify-center shrink-0">
                            <span>Galeria</span>
                            <input id="cfg-image-file" type="file" accept="image/*" class="hidden" />
                        </label>
                    </div>
                </div>

                <!-- Compartilhar Link Configurado / Reset -->
                <div class="pt-1 flex items-center justify-between gap-2">
                    <button id="copy-share-link-btn" type="button" class="flex-1 py-2 px-3 rounded-xl bg-white/10 hover:bg-white/15 text-cyan-300 font-semibold flex items-center justify-center gap-1.5 transition">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        <span id="copy-link-label">Copiar Link Configurado</span>
                    </button>
                    <button id="reset-cfg-btn" type="button" class="py-2 px-3 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 font-semibold transition">
                        Padrão
                    </button>
                </div>
            </div>

            <div class="pt-2 border-t border-white/10 flex gap-2 shrink-0">
                <button id="save-admin-btn" type="button" class="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-sm transition">
                    Salvar Alterações
                </button>
            </div>
        </div>
    </main>

    <script>
        /**
         * Configuração Padrão da Excursão
         */
        const DEFAULT_CONFIG = {
            title: 'EXCURSÃO PARA A PRAIA',
            destination: 'Praia de Salinas - Atalaia',
            price: 85.00,
            date: 'Domingo, 13/12/2026',
            deadline: '10/12/2026',
            phone: '5591989213312',
            image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80'
        };

        const STORAGE_KEY = 'excursao_praia_config_v1';
        let currentConfig = { ...DEFAULT_CONFIG };

        // Elementos da UI Principal
        const elDisplayTitle = document.getElementById('display-title');
        const elDisplayDestination = document.getElementById('display-destination');
        const elDisplayPrice = document.getElementById('display-price');
        const elDisplayDate = document.getElementById('display-date');
        const elDisplayDeadline = document.getElementById('display-deadline');
        const elDisplayImage = document.getElementById('display-image');
        const elDisplayTotal = document.getElementById('display-total');

        // Elementos do Formulário
        const elForm = document.getElementById('booking-form');
        const elNameInput = document.getElementById('passenger-name');
        const elSeatsInput = document.getElementById('seats-input');
        const elBtnMinus = document.getElementById('btn-minus');
        const elBtnPlus = document.getElementById('btn-plus');
        const elFormError = document.getElementById('form-error');
        const elFormErrorText = document.getElementById('form-error-text');

        // Elementos do Modal Organizador
        const elAdminModal = document.getElementById('admin-modal');
        const elOpenAdminBtn = document.getElementById('open-admin-btn');
        const elCloseAdminBtn = document.getElementById('close-admin-btn');
        const elSaveAdminBtn = document.getElementById('save-admin-btn');
        const elResetCfgBtn = document.getElementById('reset-cfg-btn');
        const elCopyShareLinkBtn = document.getElementById('copy-share-link-btn');
        const elCopyLinkLabel = document.getElementById('copy-link-label');

        const elCfgTitle = document.getElementById('cfg-title');
        const elCfgDestination = document.getElementById('cfg-destination');
        const elCfgPrice = document.getElementById('cfg-price');
        const elCfgDate = document.getElementById('cfg-date');
        const elCfgDeadline = document.getElementById('cfg-deadline');
        const elCfgPhone = document.getElementById('cfg-phone');
        const elCfgImageUrl = document.getElementById('cfg-image-url');
        const elCfgImageFile = document.getElementById('cfg-image-file');

        /**
         * Formata número em Moeda Brasileira (BRL)
         */
        function formatCurrency(value) {
            const num = Number(value) || 0;
            return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        /**
         * Carrega configurações da URL (parâmetros compartilhados) ou localStorage
         */
        function loadConfig() {
            try {
                const params = new URLSearchParams(window.location.search);
                if (params.has('d') || params.has('t')) {
                    currentConfig = {
                        title: params.get('t') || DEFAULT_CONFIG.title,
                        destination: params.get('d') || DEFAULT_CONFIG.destination,
                        price: parseFloat(params.get('p')) || DEFAULT_CONFIG.price,
                        date: params.get('dt') || DEFAULT_CONFIG.date,
                        deadline: params.get('dl') || DEFAULT_CONFIG.deadline,
                        phone: params.get('w') || DEFAULT_CONFIG.phone,
                        image: params.get('img') || DEFAULT_CONFIG.image
                    };
                    return;
                }

                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    currentConfig = { ...DEFAULT_CONFIG, ...parsed };
                }
            } catch (err) {
                console.warn('Erro ao carregar configuração:', err);
                currentConfig = { ...DEFAULT_CONFIG };
            }
        }

        /**
         * Atualiza a interface visual com os dados atuais
         */
        function renderUI() {
            elDisplayTitle.textContent = currentConfig.title;
            elDisplayDestination.textContent = currentConfig.destination;
            elDisplayPrice.textContent = formatCurrency(currentConfig.price);
            elDisplayDate.textContent = currentConfig.date;
            elDisplayImage.src = currentConfig.image;
            elDisplayDeadline.innerHTML = `Pagamento até <strong class="text-amber-300 underline decoration-amber-400/60">${escapeHtml(currentConfig.deadline)}</strong> para garantir sua vaga!`;
            updateTotal();
        }

        /**
         * Escapa caracteres HTML para segurança
         */
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /**
         * Calcula e atualiza o valor total com base na quantidade de vagas
         */
        function updateTotal() {
            let seats = parseInt(elSeatsInput.value, 10);
            if (isNaN(seats) || seats < 1) {
                seats = 1;
            }
            const total = seats * (Number(currentConfig.price) || 0);
            elDisplayTotal.textContent = formatCurrency(total);
        }

        /**
         * Exibe ou oculta alerta discreto de validação
         */
        function showError(msg) {
            elFormErrorText.textContent = msg;
            elFormError.classList.remove('hidden');
            elFormError.classList.add('flex');
        }

        function hideError() {
            elFormError.classList.add('hidden');
            elFormError.classList.remove('flex');
        }

        // Controles de quantidade de vagas (- / +)
        elBtnMinus.addEventListener('click', () => {
            const current = parseInt(elSeatsInput.value, 10) || 1;
            if (current > 1) {
                elSeatsInput.value = current - 1;
                updateTotal();
            }
        });

        elBtnPlus.addEventListener('click', () => {
            const current = parseInt(elSeatsInput.value, 10) || 1;
            if (current < 50) {
                elSeatsInput.value = current + 1;
                updateTotal();
            }
        });

        elSeatsInput.addEventListener('input', () => {
            updateTotal();
        });

        elSeatsInput.addEventListener('blur', () => {
            let val = parseInt(elSeatsInput.value, 10);
            if (isNaN(val) || val < 1) {
                elSeatsInput.value = 1;
            }
            updateTotal();
        });

        elNameInput.addEventListener('input', () => {
            if (elNameInput.value.trim().length > 0) {
                hideError();
            }
        });

        /**
         * Envio do Formulário -> Monta mensagem e abre o WhatsApp
         */
        elForm.addEventListener('submit', (e) => {
            e.preventDefault();
            hideError();

            const passengerName = elNameInput.value.trim();
            if (!passengerName) {
                showError('Por favor, preencha seu nome para reservar.');
                elNameInput.focus();
                return;
            }

            let seats = parseInt(elSeatsInput.value, 10);
            if (isNaN(seats) || seats < 1) {
                seats = 1;
                elSeatsInput.value = 1;
            }

            const totalFormatted = formatCurrency(seats * (Number(currentConfig.price) || 0));

            // Limpa número do WhatsApp mantendo apenas dígitos e garantindo DDI 55
            let cleanPhone = String(currentConfig.phone || '5591989213312').replace(/\D/g, '');
            if (cleanPhone.length === 11) {
                cleanPhone = '55' + cleanPhone;
            }

            // Mensagem exata solicitada
            const message =
`Olá! Quero reservar minha(as) vaga(as) para "${currentConfig.destination}"

*Nome:* ${passengerName}
*Vagas:* ${seats}
*Data:* ${currentConfig.date}
*Valor Total:* ${totalFormatted}`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
        });

        /**
         * Lógica do Modal Organizador
         */
        elOpenAdminBtn.addEventListener('click', () => {
            elCfgTitle.value = currentConfig.title;
            elCfgDestination.value = currentConfig.destination;
            elCfgPrice.value = currentConfig.price;
            elCfgDate.value = currentConfig.date;
            elCfgDeadline.value = currentConfig.deadline;
            elCfgPhone.value = currentConfig.phone;
            elCfgImageUrl.value = currentConfig.image.startsWith('data:') ? '' : currentConfig.image;
            elAdminModal.classList.remove('hidden');
        });

        elCloseAdminBtn.addEventListener('click', () => {
            elAdminModal.classList.add('hidden');
        });

        // Upload de foto local (redimensiona suavemente via Canvas para não estourar o localStorage)
        elCfgImageFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 800;
                    const scale = Math.min(1, maxWidth / img.width);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    currentConfig.image = compressedDataUrl;
                    elCfgImageUrl.value = 'Imagem carregada da galeria ✓';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Salvar alterações do organizador
        elSaveAdminBtn.addEventListener('click', () => {
            const urlVal = elCfgImageUrl.value.trim();
            const updatedImage = (urlVal && !urlVal.startsWith('Imagem carregada'))
                ? urlVal
                : currentConfig.image;

            currentConfig = {
                title: elCfgTitle.value.trim() || DEFAULT_CONFIG.title,
                destination: elCfgDestination.value.trim() || DEFAULT_CONFIG.destination,
                price: parseFloat(elCfgPrice.value) >= 0 ? parseFloat(elCfgPrice.value) : DEFAULT_CONFIG.price,
                date: elCfgDate.value.trim() || DEFAULT_CONFIG.date,
                deadline: elCfgDeadline.value.trim() || DEFAULT_CONFIG.deadline,
                phone: elCfgPhone.value.replace(/\D/g, '') || DEFAULT_CONFIG.phone,
                image: updatedImage
            };

            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
            } catch (err) {
                console.warn('Não foi possível salvar no localStorage:', err);
            }

            renderUI();
            elAdminModal.classList.add('hidden');
        });

        // Restaurar padrão
        elResetCfgBtn.addEventListener('click', () => {
            currentConfig = { ...DEFAULT_CONFIG };
            localStorage.removeItem(STORAGE_KEY);
            elCfgTitle.value = currentConfig.title;
            elCfgDestination.value = currentConfig.destination;
            elCfgPrice.value = currentConfig.price;
            elCfgDate.value = currentConfig.date;
            elCfgDeadline.value = currentConfig.deadline;
            elCfgPhone.value = currentConfig.phone;
            elCfgImageUrl.value = currentConfig.image;
            renderUI();
        });

        // Copiar link com parâmetros da excursão configurada
        elCopyShareLinkBtn.addEventListener('click', () => {
            const baseUrl = window.location.origin + window.location.pathname;
            const params = new URLSearchParams();
            params.set('t', elCfgTitle.value.trim() || currentConfig.title);
            params.set('d', elCfgDestination.value.trim() || currentConfig.destination);
            params.set('p', elCfgPrice.value || currentConfig.price);
            params.set('dt', elCfgDate.value.trim() || currentConfig.date);
            params.set('dl', elCfgDeadline.value.trim() || currentConfig.deadline);
            params.set('w', elCfgPhone.value.replace(/\D/g, '') || currentConfig.phone);

            const urlVal = elCfgImageUrl.value.trim();
            if (urlVal && urlVal.startsWith('http')) {
                params.set('img', urlVal);
            }

            const shareUrl = `${baseUrl}?${params.toString()}`;

            const tempInput = document.createElement('textarea');
            tempInput.value = shareUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            elCopyLinkLabel.textContent = 'Link Copiado!';
            setTimeout(() => {
                elCopyLinkLabel.textContent = 'Copiar Link Configurado';
            }, 2200);
        });

        // Inicialização
        window.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            renderUI();
        });
    </script>
</body>
</html>
